#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 10
    gaps_out = 10, 16, 16, 16

    border_size = 2

    # Valor inicial em Tokyo Night (#7aa2f7) em vez do ciano default do
    # Hyprland, que não casava com nada do resto do sistema. Em runtime o AGS
    # sobrescreve com a cor primária do tema (lib/palette.ts), então a borda
    # da janela ativa acompanha o wallpaper igual à barra.
    col.active_border = rgba(7aa2f7ee)
    col.inactive_border = rgba(2a2a35aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    # Opaca: com transparência o wallpaper vaza e tinge a janela da cor dele
    inactive_opacity = 1.0

    # Janela inativa NÃO escurece: o Matheus não gosta do efeito (2026-08-08).
    # O indicador de foco é a borda, que agora acompanha a cor do wallpaper
    # (col.active_border + lib/palette.ts do AGS), então o dim ficou redundante.
    # Se quiser o escurecimento sutil de volta: dim_inactive = true com
    # dim_strength = 0.1 (o 0.35 antigo era forte demais).
    dim_inactive = false
    dim_strength = 0.1

    # Fundo do workspace especial escurecido (default 0.2 deixava o wallpaper aparecer)
    dim_special = 0.4

    # Sombra ampla e difusa em vez do halo de 4px (que era invisível na
    # prática): é o que separa "janela flutuando" de "retângulo colado".
    # offset pra baixo simulaa luz vindo de cima.
    shadow {
        enabled = true
        range = 24
        render_power = 2
        offset = 0 4
        color = rgba(00000044)
        color_inactive = rgba(00000022)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        # 6/2 em vez de 8/3: cada passe re-renderiza a tela inteira, e na iGPU
        # o 3o passe custava frame sem diferença visual perceptível.
        size = 6
        passes = 2

        # xray: janelas tiladas embaçam o wallpaper, não umas às outras.
        # Além de mais barato, evita o "borrão sujo" quando duas janelas
        # opacas se encostam.
        xray = true
        # menus, tooltips e dropdowns também recebem blur (sem isso eles
        # ficam chapados no meio de uma UI toda translúcida)
        popups = true
        # o scratchpad já é escurecido por dim_special
        special = false

        vibrancy = 0.1696
        noise = 0.008
        contrast = 1.05
    }

}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    # 2.5 = 250ms (faixa Apple/Material p/ transições); os 400-480ms antigos
    # somados à cauda do easeOutQuint davam sensação de resize travado
    animation = border,        1,     2.5,   easeOutQuint
    animation = windows,       1,     2.5,   easeOutQuint
    # gnomed (fade+escala, sem direcao): o popin em tile ganhava um deslize
    # lateral junto do reflow do layout
    animation = windowsIn,     1,     2.5,   easeOutQuint, gnomed
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    # 2 em vez de 4: o fade da layer (400ms) se sobrepunha ao slide de 250ms
    # que o próprio AGS faz no revealer, e o painel central ficava translúcido
    # e se mexendo bem depois de já estar na tela. Em 200ms o fade termina
    # dentro do slide e quem comanda o movimento é o AGS.
    animation = layersIn,      1,     2,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     3,     easeOutQuint, slide
    animation = workspacesIn,  1,     3,     easeOutQuint, slide
    animation = workspacesOut, 1,     3,     easeOutQuint, slide
    animation = specialWorkspace,  1,     4,     default,      slidevert
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
    special_scale_factor = 0.9
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # Obrigatório com o hypridle: sem isso a tela apagada (dpms off) não volta
    # ao mexer no mouse ou teclar, e parece que o notebook travou.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Clicar num link no Discord/Spotify já traz o browser pra frente em vez
    # de só piscar o ícone.
    focus_on_activate = true

    # Mata a colagem acidental do X11 com o botão do meio (o scroll do
    # touchpad de 3 dedos disparava paste em editor de código).
    middle_click_paste = false

    # Nada aqui pro caso "janela nova aparece atrás de uma em fullscreen":
    # o antigo new_window_takes_over_fullscreen NÃO existe mais (nem na 0.55
    # nem na 0.56). O substituto é misc:on_focus_under_fullscreen, e o default
    # dele já é 2 — que é justamente o comportamento desejado, então não vale
    # declarar. O focus_on_activate acima cobre o resto do incômodo.
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # O default (600ms/25) é lento pra navegar em código com as setas.
    repeat_delay = 250
    repeat_rate = 40

    touchpad {
        natural_scroll = true
        # Não dispara clique/movimento com a palma da mão enquanto digita
        disable_while_typing = true
        # 2 dedos = botão direito, 3 dedos = meio. Sem isso o clique direito
        # depende de acertar a zona invisível do canto inferior direito.
        clickfinger_behavior = true
        # O scroll padrão do libinput é rápido demais neste touchpad
        scroll_factor = 0.6
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace
# 4 dedos faz o mesmo: o de 3 conflita com "arrastar seleção" em alguns apps
gesture = 4, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
# Passa pelo logind: o mesmo caminho que o hypridle e o fechar-tampa usam,
# então nunca abre dois hyprlock em cima um do outro.
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod ,C, exec, $chrome
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, J, layoutmsg, swapsplit
bind = $mainMod, Space, exec, $runner

# Layout da janela ativa
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo,
# togglesplit é uma layoutmsg do dwindle, NÃO um dispatcher (igual ao
# swapsplit do Super+J logo acima) — como dispatcher dá "does not exist".
bind = $mainMod, T, layoutmsg, togglesplit
bind = $mainMod SHIFT, C, centerwindow,
# Encerrar a sessão (não existia saída pelo teclado)
bind = $mainMod SHIFT, Q, exit,

# Screenshots. Antes só iam pro clipboard e sumiam no próximo copy;
# agora o tee grava em $shotdir E copia.
bind = , Print, exec, grim -g "$(slurp -w 2)" - | tee "$shotdir/$(date +%F_%H-%M-%S).png" | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp -w 2)" - | satty --filename - --output-filename "$shotdir/$(date +%F_%H-%M-%S).png" --early-exit --copy-command wl-copy
# Tela inteira
bind = $mainMod, Print, exec, grim - | tee "$shotdir/$(date +%F_%H-%M-%S).png" | wl-copy
# Só a janela ativa
bind = ALT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | tee "$shotdir/$(date +%F_%H-%M-%S).png" | wl-copy
# Gravação de tela: começa/para com o mesmo atalho
bind = $mainMod SHIFT, R, exec, pkill -INT wf-recorder || wf-recorder -g "$(slurp)" -f "$vidsdir/$(date +%F_%H-%M-%S).mp4"

# Modo zen: esconde a barra com animação e a moldura fica sobre tudo
bind = $mainMod, B, exec, ags request zen
bind = $mainMod, N, exec, ags request sidebar
bind = $mainMod, A, exec, ags request center
bind = $mainMod SHIFT, W, exec, ags request wallpaper
bind = $mainMod, V, exec, ags request clipboard

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover a janela pelo teclado (antes só dava pra mover o foco, a janela
# precisava de SUPER + arrastar com o mouse)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Redimensionar: SUPER+R entra no modo, setas ajustam, ESC/RETURN sai.
# binde = repete enquanto a tecla fica pressionada.
bind = $mainMod, R, submap, resize
submap = resize
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
binde = SHIFT, left, resizeactive, -10 0
binde = SHIFT, right, resizeactive, 10 0
binde = SHIFT, up, resizeactive, 0 -10
binde = SHIFT, down, resizeactive, 0 10
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Vídeo em fullscreen não deixa o hypridle escurecer/travar a tela.
# O nome da regra é idle_inhibit (snake_case) e os modos válidos são
# fullscreen / focus / always / none.
windowrule = idle_inhibit fullscreen, match:class .*

# Apps utilitários: flutuam centralizados em vez de entrar no tile e
# reorganizar o layout inteiro de trabalho.
windowrule = float true, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|io\.github\.kaii_lb\.Overskride|overskride|nm-connection-editor|blueman-manager|\.blueman-manager-wrapped)$
windowrule = size 920 620, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|io\.github\.kaii_lb\.Overskride|overskride)$
windowrule = center true, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|io\.github\.kaii_lb\.Overskride|overskride|nm-connection-editor)$

# Diálogos de arquivo (GTK portal, Thunar, Zen, VS Code) — pt_BR e en
windowrule = float true, match:title ^(Abrir|Abrir arquivo|Abrir pasta|Salvar|Salvar como|Open|Open File|Open Folder|Save|Save As|Selecionar).*$
windowrule = center true, match:title ^(Abrir|Abrir arquivo|Abrir pasta|Salvar|Salvar como|Open|Open File|Open Folder|Save|Save As|Selecionar).*$
windowrule = size 1000 680, match:title ^(Abrir|Abrir arquivo|Abrir pasta|Salvar|Salvar como|Open|Open File|Open Folder|Save|Save As).*$

# Progresso de cópia / diálogos do Thunar. Lista explícita de títulos porque o
# Hyprland 0.56 usa RE2, que não tem lookahead negativo — um ^(?!Thunar) aqui
# faria a regra falhar silenciosamente.
windowrule = float true, match:class ^(thunar)$, match:title ^(Copiando|Movendo|Excluindo|Copying|Moving|Deleting|Confirmar|Renomear|Propriedades|Progresso).*$
windowrule = center true, match:class ^(thunar)$, match:title ^(Copiando|Movendo|Excluindo|Copying|Moving|Deleting|Confirmar|Renomear|Propriedades|Progresso).*$

# Visualizador de imagem e player abrem flutuando (uso pontual, não vale tilar)
windowrule = float true, match:class ^(org\.gnome\.Loupe|mpv)$
windowrule = size 1280 760, match:class ^(org\.gnome\.Loupe|mpv)$
windowrule = center true, match:class ^(org\.gnome\.Loupe|mpv)$
windowrule = idle_inhibit focus, match:class ^(mpv)$

# Autenticação do polkit: sempre no centro, acima de tudo
windowrule = float true, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$
windowrule = center true, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$
windowrule = stay_focused true, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = float true, match:title ^(Picture-in-[Pp]icture)$
windowrule = pin true, match:title ^(Picture-in-[Pp]icture)$
windowrule = size 480 270, match:title ^(Picture-in-[Pp]icture)$
windowrule = move 1420 790, match:title ^(Picture-in-[Pp]icture)$
windowrule = no_dim true, match:title ^(Picture-in-[Pp]icture)$

# Android Emulator (emulator do Android SDK): no Wayland o Hyprland azuleja a
# janela, mas o conteúdo do device não escala junto, deixando um "quadrado
# branco" gigante com o celular no canto. Flutuar devolve o tamanho natural da
# janela e a mantém acima das janelas tiladas, mas presa ao workspace dela (sem
# pin, então não segue você por todos os espaços). A classe cobre tanto a janela
# do device quanto o toolbar destacado; o move posiciona só a janela do device
# (o toolbar acopla nela sozinho). Ajuste o move ao seu gosto.
windowrule = float true, match:class ^(Emulator)$
windowrule = no_dim true, match:class ^(Emulator)$
windowrule = move 1458 60, match:title ^(Android Emulator.*)$

# Fix some dragging issues with XWayland
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland true
