# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Painel interno explícito: as duas linhas genéricas anteriores se anulavam
# (a última vencia).
#
# vrr=0 (desligado) de propósito. O vrr=2 que estava aqui liga o refresh
# adaptativo só quando existe janela em tela cheia — e ligar/desligar VRR
# exige um MODESET, que apaga este painel por ~1,3s. Ou seja: 1,3s de tela
# preta ao entrar em tela cheia e mais 1,3s ao sair, em qualquer app.
# Medido em 2026-08-10 cronometrando o intervalo entre quadros entregues
# pelo compositor: 1,33s com vrr=2 contra 0,10s com vrr=0. Maximizar (que
# não mexe no VRR) sempre foi 0,10s — foi o que apontou o culpado.
monitor = eDP-1, 1920x1080@165, 0x0, 1, vrr, 0
# Fallback para qualquer monitor externo
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
# google-chrome, não chromium: o chromium nunca foi instalado, então o Super+C
# não fazia nada (descoberto em 2026-08-08)
$chrome = google-chrome-stable
$runner = vicinae vicinae://toggle
$vscode = code

# Destino dos prints/gravações (as pastas vêm do xdg.userDirs, que também
# acabou com a duplicata "Screenshots" vs "Capturas de tela")
$shotdir = $HOME/Pictures/Screenshots
$vidsdir = $HOME/Videos


