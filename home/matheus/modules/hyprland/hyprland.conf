
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0

# Keyring precisa estar rodando ANTES do hyprlock: assim a senha digitada
# no lock destrava o chaveiro via PAM e nenhum app pede senha de novo
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# Lock imediato
exec-once = hyprlock

# UI carrega por trás do lock (pronta quando desbloquear)
exec-once = awww-daemon
# O AGS agora é um serviço systemd de usuário (modules/ags/default.nix):
# ele sobe junto do graphical-session.target e reinicia sozinho se crashar.
# O cursor vem do home.pointerCursor (XCURSOR_*/HYPRCURSOR_* no ambiente);
# não declare aqui, senão volta a divergir entre GTK e desktop.

# Serviços de background
# Notificações: popups vêm do AGS (astal.notifd); rede/bluetooth via sidebar AGS
exec-once = vicinae server
exec-once = /run/current-system/sw/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Histórico de clipboard (aba Clip da sidebar AGS)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

