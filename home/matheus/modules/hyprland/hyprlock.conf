$font = Inter Variable
$base = rgb(1e1e2e)
$accent = rgb(cba6f7)
$text = rgb(cdd6f4)
$surface0 = rgb(313244)
$surface2 = rgb(585b70)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)
$white = rgb(ffffff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/current-wallpaper
    blur_passes = 2
    blur_size = 4
    brightness = 0.8
    color = $base
}

label {
    monitor =
    text = cmd[update:43200000] date +'%A, %d de %B'
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 128
    font_family = Inter Display
    position = 0, -110
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $surface2
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = Digite sua senha
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = Senha incorreta
    capslock_color = $yellow
    position = 0, 200
    halign = center
    valign = bottom
}
